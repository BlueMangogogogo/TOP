  document.getElementById('searchInput').value='';checked.clear();
  document.getElementById('cbxAtkAll').checked=false;document.getElementById('cbxOtkAll').checked=false;
  rA();rO();uSel();toast(d+' 数据已加载');
}

function ld(){
  let c=DATA[cur],sa=showAll?c.allAtk:c.defAtk,so=showAll?c.allOtk:c.defOtk;
  atkData=sa.slice();otkData=so.slice();
  if(c.sortKeyAtk){
    atkData.sort((a,b)=>{let va=a[c.sortKeyAtk],vb=b[c.sortKeyAtk];return va>vb?-1:va<vb?1:0;});
    otkData.sort((a,b)=>{let va=a[c.sortKeyOtk],vb=b[c.sortKeyOtk];return va<vb?-1:va>vb?1:0;});
  }
  atkSort={key:c.sortKeyAtk,asc:false};otkSort={key:c.sortKeyOtk,asc:true};
}

function fmtP(v){return(v>0?'+':'')+v.toFixed(2)+'%'}
function fmtN(v){return(v>0?'+':'')+v.toFixed(2)}
function fmtR(v){return(v>0?'+':'')+v.toFixed(2)+'%'}
function dCls(d){if(d>=25)return'days-hi';if(d>=15)return'days-md';return'days-lo'}
function rCls(n){if(n===1)return'rank r1';if(n===2)return'rank r2';if(n===3)return'rank r3';return'rank rn'}

function renderRow(r,panel){
  let c=DATA[cur],code=r.code,chgCls=r.chg>0?'c-up':'c-dn';
  let nv=r[c.netKey],nc=nv>0?'c-up':'c-dn';
  let days=panel==='atk'?r[c.atkDays]:r[c.otkDays];
  let wsRank=r.rank;
  return '<tr><td><input type="checkbox" class="cbx cbx-'+panel+'" id="cbx_'+panel+'_'+code+'" '+(checked.has(code)?'checked':'')+' onchange="onCk(\''+code+'\',this)"></td>'+
    '<td><span class="'+rCls(wsRank)+'">'+wsRank+'</span></td>'+
    '<td style="text-align:left;padding-left:6px;"><span class="blink" onclick="openDrawer(\''+code+'\')">'+r.name+'</span><span style="color:var(--t3);font-size:12px;margin-left:4px;">'+code+'</span></td>'+
    '<td class="'+chgCls+'">'+fmtP(r.chg)+'</td><td><b>'+r.score.toFixed(1)+'</b></td>'+
    '<td class="'+nc+'">'+fmtN(nv)+'</td><td>'+fmtR(r[c.inflowKey])+'</td>'+
    '<td class="'+(r.mainNet>0?'c-up':'c-dn')+'">'+fmtN(r.mainNet)+'</td>'+
    '<td><span class="days-badge '+dCls(days)+'" onclick="openDays(\''+code+'\',\''+panel+'\')" title="点击查看近30天在榜明细">'+days+'</span></td></tr>';
}

function rA(){document.getElementById('atkBody').innerHTML=atkData.map(r=>renderRow(r,'atk')).join('');document.getElementById('atkCount').textContent=atkData.length+'个板块'}
function rO(){document.getElementById('otkBody').innerHTML=otkData.map(r=>renderRow(r,'otk')).join('');document.getElementById('otkCount').textContent=otkData.length+'个板块'}

function uh(){
  let c=DATA[cur];
  ['atk','otk'].forEach(p=>{
    let h=document.getElementById('hdr_'+p+'_net');
    if(h){h.innerHTML=c.netLabel+' <span class="sort-arrow" id="arr_'+p+'_'+c.netKey+'"></span>';h.setAttribute('onclick',"doSort('"+p+"','"+c.netKey+"')")}
    h=document.getElementById('hdr_'+p+'_inflow');
    if(h){h.innerHTML=c.inflowLabel+' <span class="sort-arrow" id="arr_'+p+'_'+c.inflowKey+'"></span>';h.setAttribute('onclick',"doSort('"+p+"','"+c.inflowKey+"')")}
  });
}

function ca(p){
  ['name','chg','score',DATA[cur].netKey,DATA[cur].inflowKey,'mainNet',p==='atk'?'aDays':'oDays'].forEach(k=>{
    let e=document.getElementById('arr_'+p+'_'+k);if(e)e.textContent='';
  });
}

function sa(p,k,asc){ca(p);let e=document.getElementById('arr_'+p+'_'+k);if(e)e.textContent=asc?(th==='light'?'\u25b2':'\u25b3'):(th==='light'?'\u25bc':'\u25bd');}

function doSort(p,k){
  let st=p==='atk'?atkSort:otkSort,data=p==='atk'?atkData:otkData;
  if(st.key===k){st.asc=!st.asc}else{st.key=k;st.asc=true}
  data.sort((a,b)=>{
    let va=a[k],vb=b[k];
    if(typeof va==='string'){va=va.toLowerCase();vb=vb.toLowerCase()}
    if(va<vb)return st.asc?-1:1;if(va>vb)return st.asc?1:-1;return 0;
  });
  if(p==='atk')rA();else rO();sa(p,k,st.asc);
}

function onCk(code,cb){if(cb.checked)checked.add(code);else checked.delete(code);uSel();sCb(cb.classList.contains('cbx-atk')?'atk':'otk')}
function toggleCheckAll(p){
  let d=p==='atk'?atkData:otkData,m=document.getElementById('cbx'+p.charAt(0).toUpperCase()+p.slice(1)+'All'),cbs=document.querySelectorAll('.cbx-'+p);
  if(m.checked){d.forEach(r=>checked.add(r.code));cbs.forEach(c=>c.checked=true)}
  else{d.forEach(r=>checked.delete(r.code));cbs.forEach(c=>c.checked=false)}
  uSel();
}
function sCb(p){let d=p==='atk'?atkData:otkData,m=document.getElementById('cbx'+p.charAt(0).toUpperCase()+p.slice(1)+'All'),ac=d.every(r=>checked.has(r.code));m.checked=ac&&d.length>0;m.indeterminate=!ac&&d.some(r=>checked.has(r.code))}
function uSel(){document.getElementById('selCount').textContent=checked.size;sCb('atk');sCb('otk')}

function exportTxt(){
  if(checked.size===0){toast('请先勾选板块');return}
  let allS=[],names=[],total=0;
  ALL.forEach(r=>{if(!checked.has(r.code))return;let s=STOCKS[r.code]||[];allS=allS.concat(s);names.push(r.name+'('+s.length+')');total+=s.length});
  if(!allS.length){toast('无成分股数据');return}
  let fn='板块成分股_';
  if(names.length<=3)fn+=names.join('_');else fn+=names[0]+'等'+names.length+'板块';
  fn+='_'+curDate.replace(/-/g,'')+'.txt';
  let b=new Blob([allS.join('\n')],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=fn;a.click();URL.revokeObjectURL(u);toast('\u2705 '+fn+' ('+total+'只)');
}

function setMode(m){
  if(cur===m)return;cur=m;
  document.querySelectorAll('.mode-btns button').forEach((b,i)=>b.classList.toggle('mode-active',(m==='band'&&i===0)||(m==='inflow'&&i===1)||(m==='main'&&i===2)));
  ld();uh();ca('atk');ca('otk');
  let c=DATA[m];if(c.sortKeyAtk){sa('atk',c.sortKeyAtk,false);sa('otk',c.sortKeyOtk,true)}
  rA();rO();uSel();
}

function toggleAll(){
  showAll=!showAll;let b=document.getElementById('btnAll');
  if(showAll){
    b.textContent='📋 默认视图';b.classList.add('active');
    document.getElementById('atkLabel').textContent='1~'+HALF+'名';document.getElementById('otkLabel').textContent=(HALF+1)+'~'+ALL.length+'名';
  }else{
    b.textContent='📋 全部板块';b.classList.remove('active');
    document.getElementById('atkLabel').textContent='TOP 10%';document.getElementById('otkLabel').textContent='BOTTOM 10%';
  }
  ld();uh();ca('atk');ca('otk');
  let c=DATA[cur];if(c.sortKeyAtk){sa('atk',c.sortKeyAtk,false);sa('otk',c.sortKeyOtk,true)}
  document.getElementById('searchInput').value='';checked.clear();
  document.getElementById('cbxAtkAll').checked=false;document.getElementById('cbxOtkAll').checked=false;
  rA();rO();uSel();
}

function doSearch(){
  let q=document.getElementById('searchInput').value.toLowerCase(),c=DATA[cur],sa=showAll?c.allAtk:c.defAtk,so=showAll?c.allOtk:c.defOtk;
  if(q){
    atkData=sa.filter(r=>r.name.toLowerCase().includes(q)||r.code.includes(q));
    otkData=so.filter(r=>r.name.toLowerCase().includes(q)||r.code.includes(q));
  }else{
    atkData=sa.slice();otkData=so.slice();
    if(c.sortKeyAtk){
      atkData.sort((a,b)=>{let va=a[c.sortKeyAtk],vb=b[c.sortKeyAtk];return va>vb?-1:va<vb?1:0;});
      otkData.sort((a,b)=>{let va=a[c.sortKeyOtk],vb=b[c.sortKeyOtk];return va<vb?-1:va>vb?1:0;});
    }
  }
  atkSort={key:c.sortKeyAtk,asc:false};otkSort={key:c.sortKeyOtk,asc:true};
  ca('atk');ca('otk');if(c.sortKeyAtk&&!q){sa('atk',c.sortKeyAtk,false);sa('otk',c.sortKeyOtk,true)}
  rA();rO();uSel();
}

function toggleTheme(){
  th=th==='light'?'dark':'light';document.body.setAttribute('data-theme',th);
  document.querySelector('.theme-btn').textContent=th==='light'?'☀️':'🌙';
  let ak=atkSort.key,ok=otkSort.key;if(ak)sa('atk',ak,atkSort.asc);if(ok)sa('otk',ok,otkSort.asc);
  if(drChart)drRenderChart();
}

function toast(m){let e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2000)}

// ══════════ DRAWER v2 ══════════
let drCode=null,drChart=null,drMulti=false,drMetrics=[];

function openDrawer(code){
  drCode=code;let b=BOARD[code];if(!b)return;
  document.getElementById('drName').textContent=b.name;document.getElementById('drCode').textContent=code;
  let lead=b.leading,leadHtml='';
  if(lead){
    leadHtml='<div class="drawer-lead">📈 当日领涨: <b>'+lead.name+'</b> <span class="c-up">'+fmtP(lead.chg)+'</span>';
    if(lead.ties&&lead.ties.length>1){
      let tn=lead.ties.map(t=>t.name).slice(0,3).join(', ');
      leadHtml+='<span class="lead-note">⚠ 多股同涨幅: '+tn+'</span>';
    }
    leadHtml+='</div>';
  }
  let cards='<div class="mcards"><div class="mcard"><div class="ml">当日涨跌幅</div><div class="mv '+(b.chg>0?'c-up':'c-dn')+'">'+fmtP(b.chg)+'</div></div>';
  cards+='<div class="mcard"><div class="ml">加权评分排名</div><div class="mv">#'+b.r_ws+'</div><div class="ms">加权评分 '+b.score.toFixed(1)+'</div></div>';
  cards+='<div class="mcard"><div class="ml">单日流入率排名</div><div class="mv">#'+b.r_inflow+'</div><div class="ms">单日流入率 '+fmtR(b.inflow)+'</div></div>';
  cards+='<div class="mcard"><div class="ml">波段净额排名</div><div class="mv">#'+b.r_band_net+'</div><div class="ms">波段净额 '+fmtN(b.bandNet)+'亿</div></div></div>';
  let ol=b.overlap||[],olHtml='';
  if(ol.length){
    olHtml='<div class="overlap-section"><h4>⛓ 成分近似板块</h4>';
    ol.forEach(o=>olHtml+='<div class="overlap-item" onclick="openDrawer(\''+o.code+'\')"><span class="blink">'+o.name+'</span><div class="oi-bar"><div class="oi-fill" style="width:'+o.rate+'%"></div></div><span class="oi-rate">'+o.rate+'%</span></div>');
    olHtml+='</div>';
  }
  document.getElementById('drawerBody').innerHTML=
    '<div class="drawer-date">📅 2026-08-07</div>'+leadHtml+cards+
    '<div class="chart-section"><div class="chart-toolbar">'+
    '<button class="chart-active" data-m="ws" onclick="drChartSwitch(\'ws\',this)">加权评分</button>'+
    '<button data-m="rank" onclick="drChartSwitch(\'rank\',this)">排名</button>'+
    '<button data-m="chg" onclick="drChartSwitch(\'chg\',this)">涨跌幅</button>'+
    '<button data-m="inflow" onclick="drChartSwitch(\'inflow\',this)">单日流入率</button>'+
    '<button data-m="band" onclick="drChartSwitch(\'band\',this)">波段净额</button>'+
    '<button data-m="main" onclick="drChartSwitch(\'main\',this)">单日净额</button>'+
    '<button data-m="ondays" onclick="drChartSwitch(\'ondays\',this)">在榜天数</button>'+
    '<div class="chart-mode"><label><input type="radio" name="drmode" checked onchange="drSetMulti(false)">单指标</label>'+
    '<label><input type="radio" name="drmode" onchange="drSetMulti(true)">双指标</label></div></div>'+
    '<div class="chart-wrap"><canvas id="drCanvas"></canvas></div></div>'+olHtml;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerBackdrop').classList.add('show');
  drMulti=false;drMetrics=['ws'];drRenderChart();
}

function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerBackdrop').classList.remove('show');
  drCode=null;if(drChart){drChart.destroy();drChart=null}
}

function drSetMulti(v){drMulti=v;drRenderChart()}

function drChartSwitch(metric,btn){
  if(!drMulti){
    drMetrics=[metric];
    document.querySelectorAll('.chart-toolbar [data-m]').forEach(b=>b.classList.remove('chart-active'));
    btn.classList.add('chart-active');
  }else{
    let i=drMetrics.indexOf(metric);
    if(i>=0){
      drMetrics.splice(i,1);btn.classList.remove('chart-active');
      if(!drMetrics.length){
        drMetrics=['ws'];let fb=document.querySelector('.chart-toolbar [data-m="ws"]');if(fb)fb.classList.add('chart-active');
      }
    }else{
      if(drMetrics.length>=2){
        let rm=drMetrics.shift();
        document.querySelectorAll('.chart-toolbar [data-m]').forEach(b=>{if(b.getAttribute('data-m')===rm)b.classList.remove('chart-active')});
      }
      drMetrics.push(metric);btn.classList.add('chart-active');
    }
  }
  drRenderChart();
}

// ═══ CHART v2: rank fix (no reverse, use yAxis.reverse) + K-line bars for chg/inflow/main ═══
function drRenderChart(){
  if(!drCode)return;let b=BOARD[drCode],h=b.history||[];if(!h.length)return;
  if(drChart){drChart.destroy();drChart=null}
  let ctx=document.getElementById('drCanvas');if(!ctx)return;
  let TN=ALL.length,labels=h.map(p=>p.d.slice(5));
  let cList=['#2563eb','#dc2626','#16a34a','#d97706','#0891b2','#7c3aed','#db2777'];
  let metaMap={
    ws:{label:'加权评分',key:'ws',c:0,style:'line'},
    rank:{label:'排名',key:'r_ws',c:1,style:'line',revAx:true},
    chg:{label:'涨跌幅',key:'chg',c:2,style:'kl',unit:'%'},
    inflow:{label:'单日流入率',key:'inflow',c:3,style:'kl',unit:'%'},
    band:{label:'波段净额',key:'bandNet',c:5,style:'kl',unit:'亿',noCum:true},
    main:{label:'单日净额',key:'mainNet',c:4,style:'kl',unit:'亿'},
    ondays:{label:'在榜天数',key:'aDays',c:6,style:'line'}
  };
  let datasets=[],hasDual=false,chartType='line',revAx=false;

  drMetrics.forEach((m,i)=>{
    let mm=metaMap[m];if(!mm)return;
    let vals=h.map(p=>{let v=p[mm.key];return(v===undefined||v===null)?null:v;});
    let yAx=i===1&&drMulti?'y1':'y';
    if(mm.revAx)revAx=true;

    if(mm.style==='kl'){
      chartType='bar';
      let bg=vals.map(v=>v>=0?'rgba(22,163,74,0.5)':'rgba(220,38,38,0.5)');
      let bc=vals.map(v=>v>=0?'rgb(22,163,74)':'rgb(220,38,38)');
      datasets.push({label:mm.label,data:vals,backgroundColor:bg,borderColor:bc,borderWidth:1,yAxisID:yAx,type:'bar',order:2});
      if(!mm.noCum){
        let cum=0,cumul=vals.map(v=>{cum+=(v||0);return +cum.toFixed(2);});
        datasets.push({label:mm.label+' (累)',data:cumul,borderColor:cList[mm.c],backgroundColor:'transparent',borderWidth:2.5,tension:.3,pointRadius:2,fill:false,yAxisID:yAx,type:'line',order:1});
      }
      if(i===1&&drMulti)hasDual=true;
    }else{
      datasets.push({label:mm.label,data:vals,borderColor:cList[mm.c],backgroundColor:cList[mm.c]+'20',tension:.3,pointRadius:2,borderWidth:2,yAxisID:yAx,type:'line'});
      if(i===1&&drMulti)hasDual=true;
      if(!drMulti&&datasets.length===1){
        let avg=vals.reduce((a,b)=>a+(b||0),0)/(vals.filter(v=>v!==null).length||1);
        datasets.push({label:'均值',data:h.map(()=>avg),borderColor:cList[mm.c],borderDash:[5,5],pointRadius:0,borderWidth:1.5,fill:false,yAxisID:'y',type:'line'});
      }
    }
  });

  let gridCol=th==='light'?'#e2e8f0':'#21262d',tickCol=th==='light'?'#64748b':'#8b949e';
  let scales={x:{grid:{color:gridCol},ticks:{color:tickCol,font:{size:10},maxTicksLimit:10}},y:{position:'left',reverse:revAx,grid:{color:gridCol},ticks:{color:tickCol,font:{size:10}}}};
  if(hasDual)scales.y1={position:'right',grid:{drawOnChartArea:false},ticks:{color:tickCol,font:{size:10}}};
  drChart=new Chart(ctx,{type:chartType,data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},plugins:{legend:{labels:{color:tickCol,font:{size:11}}}},scales}});
}

function copyStocks(){if(!drCode)return;let s=STOCKS[drCode]||[];navigator.clipboard.writeText(s.join('\n')).then(()=>toast('✅ 已复制 '+s.length+'只成分股')).catch(()=>toast('复制失败'));}
function exportStocks(){if(!drCode)return;let s=STOCKS[drCode]||[],b=BOARD[drCode],fn=(b?b.name:drCode)+'_成分股_'+curDate.replace(/-/g,'')+'.txt',bl=new Blob([s.join('\n')],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download=fn;a.click();URL.revokeObjectURL(u);toast('✅ '+fn+' ('+s.length+'只)');}

// ═══ 在榜日历弹窗 ═══
let daysCode=null,daysPanel=null;
function openDays(code,panel){
  let b=BOARD[code];if(!b)return;
  daysCode=code;daysPanel=panel;
  let total=ALL.length,topN=Math.max(1,Math.round(total*.1));
  let isAtk=(panel==='atk');
  document.getElementById('daysTitle').textContent=b.name;
  document.getElementById('daysCode').textContent=code+' · '+(isAtk?'进攻榜前'+topN+'名':'重灾区后'+topN+'名');
  let h=(b.history||[]).slice(-30);
  let html='<div class="days-legend"><span class="lg"><span class="sw" style="background:rgba(220,38,38,.15);border:1px solid var(--red)"></span>'+(isAtk?'进攻榜在榜':'重灾区在榜')+'</span><span class="lg"><span class="sw" style="background:var(--bg3);border:1px solid var(--border)"></span>不在榜</span><span class="lg">数字=当日排名</span></div>';
  let cells='';
  h.forEach(p=>{
    if(!p||!p.d)return;
    let d=p.d,dt=new Date(d),wd=dt.getDay();
    let inList=isAtk?(p.rank<=topN):(p.rank>total-topN);
    let cls='days-cell'+(inList?(isAtk?' in-atk':' in-otk'):'')+(wd===0||wd===6?' weekend':'');
    let rankHtml=inList?'<div class="dc-rank" style="color:'+(isAtk?'var(--red)':'var(--green)')+'">#'+p.rank+'</div>':'<div class="dc-rank" style="color:var(--t3)">—</div>';
    cells+='<div class="'+cls+'"><div class="dc-date">'+d.slice(5).replace('-','/')+'</div>'+rankHtml+'</div>';
  });
  let inCount=h.filter(p=>p&&(isAtk?p.rank<=topN:p.rank>total-topN)).length;
  html+='<div class="days-grid">'+cells+'</div>';
  html+='<div class="days-sum">近30个交易日，该板块'+(isAtk?'进入进攻榜前'+topN+'名':'落入重灾区后'+topN+'名')+'共 <b style="color:var(--text)">'+inCount+'</b> 天。上方曲线为在榜天数变化，红色=进攻榜在榜，绿色=重灾区在榜，数字为该日加权评分排名。</div>';
  document.getElementById('daysBody').innerHTML=html;
  renderDaysChart(h,isAtk);
  document.getElementById('daysModal').classList.add('open');
  document.getElementById('daysBackdrop').classList.add('show');
}
let daysChart=null;
function renderDaysChart(h,isAtk){
  let ctx=document.getElementById('daysCanvas');if(!ctx)return;
  let existing=Chart.getChart(ctx);
  if(existing){existing.destroy();}
  if(daysChart){try{daysChart.destroy()}catch(e){}daysChart=null}
  let labels=h.map(p=>p.d.slice(5).replace('-','/'));
  let vals=h.map(p=>isAtk?(p.aDays||0):(p.oDays||0));
  let col=isAtk?'#dc2626':'#16a34a';
  let gridCol=th==='light'?'#e2e8f0':'#21262d',tickCol=th==='light'?'#64748b':'#8b949e';
  daysChart=new Chart(ctx,{type:'line',data:{labels,datasets:[{label:isAtk?'进攻榜在榜天数':'重灾区在榜天数',data:vals,borderColor:col,backgroundColor:col+'22',tension:.3,pointRadius:2.5,borderWidth:2,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:tickCol,font:{size:11}}}},scales:{x:{grid:{color:gridCol},ticks:{color:tickCol,font:{size:9},maxTicksLimit:10}},y:{grid:{color:gridCol},ticks:{color:tickCol,font:{size:10}},suggestedMin:0,suggestedMax:30}}}});
}
function closeDays(){
  document.getElementById('daysModal').classList.remove('open');
  document.getElementById('daysBackdrop').classList.remove('show');
  if(daysChart){daysChart.destroy();daysChart=null}
  daysCode=null;daysPanel=null;
}

ld();rA();rO();

</script>
