<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TdxClaw 分析报告中心</title>
<style>
:root {
  --bg: #0a0e17;
  --bg2: #0d1525;
  --bg3: #111d33;
  --border: #1a2f50;
  --text: #d0ddf0;
  --text2: #7b93b8;
  --text3: #556688;
  --accent: #ebb543;
  --accent2: #ef5350;
  --green: #26c961;
  --blue: #60c0ff;
  --purple: #a78bfa;
  --orange: #ff9800;
  --font: system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  font-size: 14px;
  overflow: hidden;
  height: 100vh;
}

/* ===== Top Bar ===== */
.topbar {
  height: 48px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
  z-index: 100;
}
.topbar .brand {
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 8px;
}
.topbar .brand span { color: var(--text); font-weight: 400; font-size: 13px; }
.topbar .nav-links { display: flex; gap: 16px; align-items: center; }
.topbar .nav-links a {
  color: var(--text2);
  text-decoration: none;
  font-size: 13px;
  padding: 4px 12px;
  border-radius: 4px;
  transition: all 0.2s;
  border: 1px solid transparent;
}
.topbar .nav-links a:hover, .topbar .nav-links a.active {
  color: var(--accent);
  border-color: var(--accent);
  background: rgba(235,181,67,0.06);
}

/* ===== Layout ===== */
.layout {
  display: flex;
  height: calc(100vh - 48px);
}
.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.main {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
}
.main::-webkit-scrollbar { width: 6px; }
.main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ===== Sidebar Filters ===== */
.filters {
  padding: 14px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.filter-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text2);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font);
  text-align: left;
}
.filter-btn:hover { background: var(--bg3); color: var(--text); }
.filter-btn.active {
  background: rgba(235,181,67,0.08);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}
.filter-btn .count {
  margin-left: auto;
  font-size: 11px;
  color: var(--text3);
  background: var(--bg3);
  padding: 1px 7px;
  border-radius: 10px;
}
.filter-btn.active .count { background: rgba(235,181,67,0.15); color: var(--accent); }

/* ===== Timeline ===== */
.timeline {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
}
.timeline::-webkit-scrollbar { width: 4px; }
.timeline::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.timeline-month {
  margin-bottom: 2px;
}
.timeline-month-header {
  font-size: 12px;
  font-weight: 700;
  color: var(--text3);
  padding: 10px 8px 6px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.timeline-date {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px 6px 16px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text2);
  transition: all 0.15s;
  border-left: 2px solid transparent;
}
.timeline-date:hover { background: var(--bg3); color: var(--text); }
.timeline-date.active {
  background: rgba(96,192,255,0.06);
  border-left-color: var(--blue);
  color: var(--blue);
  font-weight: 600;
}
.timeline-date .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text3);
  flex-shrink: 0;
}
.timeline-date.active .dot { background: var(--blue); }
.timeline-date .report-count {
  margin-left: auto;
  font-size: 11px;
  color: var(--text3);
}
.timeline-date.active .report-count { color: var(--blue); }

/* ===== Main Content ===== */
.main-header {
  margin-bottom: 20px;
}
.main-header h2 {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
}
.main-header .subtitle {
  font-size: 13px;
  color: var(--text2);
  margin-top: 4px;
}
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text3);
}
.empty-state .icon { font-size: 48px; margin-bottom: 16px; }
.empty-state p { font-size: 15px; margin-bottom: 6px; }

/* ===== Report Cards ===== */
.report-list { display: flex; flex-direction: column; gap: 8px; }
.report-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}
.report-card:hover {
  border-color: var(--accent);
  background: rgba(235,181,67,0.03);
}
.star-btn {
  width: 32px; height: 32px;
  border: none;
  background: transparent;
  font-size: 18px;
  cursor: pointer;
  border-radius: 6px;
  transition: all 0.2s;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text3);
}
.star-btn:hover { background: var(--bg3); color: var(--accent); }
.star-btn.starred { color: var(--accent); }
.report-info { flex: 1; min-width: 0; }
.report-info .title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.report-info .meta {
  font-size: 12px;
  color: var(--text3);
  display: flex;
  gap: 12px;
  align-items: center;
}
.report-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
}
.badge-daily { background: rgba(96,192,255,0.1); color: var(--blue); }
.badge-industry { background: rgba(167,139,250,0.1); color: var(--purple); }

.date-divider {
  font-size: 13px;
  font-weight: 700;
  color: var(--text3);
  padding: 16px 0 4px 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
.date-divider:first-child { padding-top: 0; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.modal-container {
  width: 96vw;
  height: 94vh;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.modal-topbar {
  height: 44px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  flex-shrink: 0;
}
.modal-topbar .modal-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  margin-right: 12px;
}
.modal-actions { display: flex; gap: 8px; align-items: center; }
.modal-btn {
  width: 32px; height: 32px;
  border: 1px solid var(--border);
  background: var(--bg3);
  color: var(--text2);
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.modal-btn:hover { background: var(--border); color: var(--text); }
.modal-btn.close:hover { background: rgba(239,83,80,0.15); color: var(--accent2); border-color: var(--accent2); }
.modal-body {
  flex: 1;
  position: relative;
  overflow: hidden;
}
.modal-body iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: #fff;
}
.modal-loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text3);
  font-size: 14px;
}
.modal-loading .spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 13px;
  z-index: 2000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.toast.show { opacity: 1; }

/* ===== Mobile ===== */
@media (max-width: 768px) {
  .sidebar { width: 200px; min-width: 200px; }
  .main { padding: 14px 12px; }
  .topbar { padding: 0 12px; }
  .topbar .brand span { display: none; }
  .report-card { padding: 10px 12px; gap: 8px; }
  .report-info .title { font-size: 13px; }
  .modal-container { width: 100vw; height: 100vh; border-radius: 0; }
}
@media (max-width: 480px) {
  .sidebar { display: none; }
  .mobile-filter-bar {
    display: flex;
    gap: 6px;
    padding: 10px 12px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .mobile-filter-bar .filter-btn { white-space: nowrap; font-size: 12px; padding: 6px 10px; }
}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="brand">📊 <span>TdxClaw 分析报告中心</span></div>
  <div class="nav-links">
    <a href="reports.html" class="active">📄 分析报告</a>
    <a href="/TOP/">📈 板块雷达</a>
  </div>
</div>

<!-- Main Layout -->
<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="filters">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">
        📋 全部报告 <span class="count" id="count-all">0</span>
      </button>
      <button class="filter-btn" data-filter="daily" onclick="setFilter('daily')">
        📅 日报 <span class="count" id="count-daily">0</span>
      </button>
      <button class="filter-btn" data-filter="industry" onclick="setFilter('industry')">
        🔬 行业报告 <span class="count" id="count-industry">0</span>
      </button>
      <button class="filter-btn" data-filter="starred" onclick="setFilter('starred')">
        ⭐ 我的收藏 <span class="count" id="count-starred">0</span>
      </button>
    </div>
    <div class="timeline" id="timeline">
      <div style="text-align:center;padding:30px 0;color:var(--text3);font-size:13px">
        <div class="spinner" style="margin:0 auto 10px;width:24px;height:24px;border-width:2px"></div>
        加载中...
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main" id="main-content">
    <div class="main-header">
      <h2 id="main-title">📋 全部报告</h2>
      <div class="subtitle" id="main-subtitle">正在加载报告数据...</div>
    </div>
    <div id="report-area">
      <div class="empty-state">
        <div class="icon">⏳</div>
        <p>正在加载报告列表...</p>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal-container" onclick="event.stopPropagation()">
    <div class="modal-topbar">
      <div class="modal-title" id="modal-title">报告标题</div>
      <div class="modal-actions">
        <button class="modal-btn" id="modal-star-btn" onclick="toggleModalStar()" title="收藏">⭐</button>
        <button class="modal-btn" onclick="window.open(document.getElementById('modal-iframe').src, '_blank')" title="新窗口打开">🔗</button>
        <button class="modal-btn close" onclick="closeModal()" title="关闭">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-loading" id="modal-loading">
        <div class="spinner"></div> 加载报告中...
      </div>
      <iframe id="modal-iframe" src="" style="display:none" onload="onIframeLoad()"></iframe>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== State =====
let allReports = [];
let currentFilter = 'all';
let currentDate = null;
let currentModalReport = null;

// ===== Init =====
document.addEventListener('DOMContentLoaded', loadReports);

async function loadReports() {
  try {
    const resp = await fetch('reports/report_index.json?' + Date.now());
    const data = await resp.json();
    allReports = data.reports || [];
    updateCounts();
    renderTimeline();
    setFilter('all');
  } catch (e) {
    console.error('加载报告索引失败:', e);
    document.getElementById('report-area').innerHTML = `
      <div class="empty-state">
        <div class="icon">📭</div>
        <p>暂无报告数据</p>
        <p style="font-size:12px;color:var(--text3)">报告索引尚未生成，请先运行同步脚本</p>
      </div>`;
    document.getElementById('main-subtitle').textContent = '报告索引加载失败';
    document.getElementById('timeline').innerHTML = '<div style="text-align:center;padding:30px;color:var(--text3)">无数据</div>';
  }
}

// ===== Timeline =====
function renderTimeline() {
  const dates = [...new Set(allReports.map(r => r.date))].sort().reverse();
  const container = document.getElementById('timeline');

  if (dates.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text3)">无数据</div>';
    return;
  }

  let html = '';
  let currentMonth = '';
  for (const date of dates) {
    const month = date.substring(0, 7);
    if (month !== currentMonth) {
      currentMonth = month;
      const [y, m] = month.split('-');
      html += `<div class="timeline-month"><div class="timeline-month-header">${y}年${parseInt(m)}月</div>`;
    }
    const count = allReports.filter(r => r.date === date).length;
    const [y, m, d] = date.split('-');
    const activeClass = currentDate === date ? ' active' : '';
    html += `<div class="timeline-date${activeClass}" data-date="${date}" onclick="selectDate('${date}')">
      <span class="dot"></span>
      ${parseInt(m)}月${parseInt(d)}日
      <span class="report-count">${count}篇</span>
    </div>`;
  }
  html += '</div>';
  container.innerHTML = html;
}

// ===== Filter =====
function setFilter(filter) {
  currentFilter = filter;
  currentDate = null;

  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.filter-btn[data-filter="${filter}"]`)?.classList.add('active');
  document.querySelectorAll('.timeline-date').forEach(d => d.classList.remove('active'));

  let filtered = getFilteredReports();
  renderReportList(filtered);

  const titles = { all: '📋 全部报告', daily: '📅 日报', industry: '🔬 行业报告', starred: '⭐ 我的收藏' };
  document.getElementById('main-title').textContent = titles[filter] || '报告列表';
  document.getElementById('main-subtitle').textContent = `共 ${filtered.length} 篇报告`;
}

function selectDate(date) {
  currentDate = date;
  document.querySelectorAll('.timeline-date').forEach(d => d.classList.remove('active'));
  const el = document.querySelector(`.timeline-date[data-date="${date}"]`);
  if (el) el.classList.add('active');

  let filtered = allReports.filter(r => r.date === date);
  if (currentFilter === 'starred') {
    const starred = getStarred();
    filtered = filtered.filter(r => starred.has(r.id));
  } else if (currentFilter !== 'all') {
    filtered = filtered.filter(r => r.type === currentFilter);
  }

  renderReportList(filtered);
  const [y, m, d] = date.split('-');
  document.getElementById('main-title').textContent = `📅 ${parseInt(m)}月${parseInt(d)}日`;
  document.getElementById('main-subtitle').textContent = `共 ${filtered.length} 篇报告`;
}

function getFilteredReports() {
  let reports = allReports;
  if (currentFilter === 'starred') {
    const starred = getStarred();
    reports = reports.filter(r => starred.has(r.id));
  } else if (currentFilter !== 'all') {
    reports = reports.filter(r => r.type === currentFilter);
  }
  return reports;
}

// ===== Report List =====
function renderReportList(reports) {
  const area = document.getElementById('report-area');
  if (reports.length === 0) {
    const msgs = {
      all: '暂无报告数据',
      daily: '暂无日报报告',
      industry: '暂无行业报告',
      starred: '还没有收藏任何报告，点击 ⭐ 来收藏吧！'
    };
    area.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>${msgs[currentFilter] || '暂无数据'}</p></div>`;
    return;
  }

  // Group by date if showing all/filtered without date selection
  let html = '<div class="report-list">';
  if (!currentDate) {
    const dates = [...new Set(reports.map(r => r.date))].sort().reverse();
    for (const date of dates) {
      const [y, m, d] = date.split('-');
      html += `<div class="date-divider">📅 ${parseInt(m)}月${parseInt(d)}日</div>`;
      const dateReports = reports.filter(r => r.date === date);
      for (const r of dateReports) {
        html += renderCard(r);
      }
    }
  } else {
    for (const r of reports) {
      html += renderCard(r);
    }
  }
  html += '</div>';
  area.innerHTML = html;

  // Update star buttons
  updateStarButtons();
}

function renderCard(r) {
  const badgeClass = r.type === 'daily' ? 'badge-daily' : 'badge-industry';
  const badgeText = r.type === 'daily' ? r.category : '行业报告';
  const starred = getStarred().has(r.id);
  const starClass = starred ? ' starred' : '';
  return `
    <div class="report-card" onclick="openReport('${r.id}')">
      <button class="star-btn${starClass}" onclick="event.stopPropagation();toggleStar('${r.id}')" data-report-id="${r.id}">
        ${starred ? '⭐' : '☆'}
      </button>
      <div class="report-info">
        <div class="title">${r.title}</div>
        <div class="meta">
          <span>📅 ${r.display_date}</span>
          <span>📄 ${r.size_kb}KB</span>
        </div>
      </div>
      <span class="report-badge ${badgeClass}">${badgeText}</span>
    </div>`;
}

// ===== Stars (localStorage) =====
function getStarred() {
  try {
    return new Set(JSON.parse(localStorage.getItem('tdxclaw_starred') || '[]'));
  } catch { return new Set(); }
}

function toggleStar(reportId) {
  const starred = getStarred();
  if (starred.has(reportId)) {
    starred.delete(reportId);
    showToast('已取消收藏');
  } else {
    starred.add(reportId);
    showToast('⭐ 已加入收藏');
  }
  localStorage.setItem('tdxclaw_starred', JSON.stringify([...starred]));
  updateStarButtons();
  updateCounts();
  if (currentFilter === 'starred') setFilter('starred');
}

function updateStarButtons() {
  const starred = getStarred();
  document.querySelectorAll('.star-btn[data-report-id]').forEach(btn => {
    const id = btn.getAttribute('data-report-id');
    if (starred.has(id)) {
      btn.classList.add('starred');
      btn.textContent = '⭐';
    } else {
      btn.classList.remove('starred');
      btn.textContent = '☆';
    }
  });
}

function updateCounts() {
  const total = allReports.length;
  const daily = allReports.filter(r => r.type === 'daily').length;
  const industry = allReports.filter(r => r.type === 'industry').length;
  const starred = getStarred().size;

  document.getElementById('count-all').textContent = total;
  document.getElementById('count-daily').textContent = daily;
  document.getElementById('count-industry').textContent = industry;
  document.getElementById('count-starred').textContent = starred;
}

// ===== Modal =====
function openReport(reportId) {
  const report = allReports.find(r => r.id === reportId);
  if (!report) return;

  currentModalReport = report;
  document.getElementById('modal-title').textContent = report.title;
  document.getElementById('modal-iframe').style.display = 'none';
  document.getElementById('modal-loading').style.display = 'flex';
  document.getElementById('modal-iframe').src = report.relative_path;

  const starred = getStarred().has(reportId);
  document.getElementById('modal-star-btn').textContent = starred ? '⭐' : '☆';
  document.getElementById('modal-star-btn').style.color = starred ? 'var(--accent)' : 'var(--text2)';

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('modal-iframe').src = '';
  document.body.style.overflow = '';
  currentModalReport = null;
}

function onIframeLoad() {
  document.getElementById('modal-loading').style.display = 'none';
  document.getElementById('modal-iframe').style.display = 'block';
}

function toggleModalStar() {
  if (!currentModalReport) return;
  toggleStar(currentModalReport.id);
  const starred = getStarred().has(currentModalReport.id);
  document.getElementById('modal-star-btn').textContent = starred ? '⭐' : '☆';
  document.getElementById('modal-star-btn').style.color = starred ? 'var(--accent)' : 'var(--text2)';
}

// ===== Keyboard =====
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ===== Toast =====
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}
</script>
</body>
</html>
